<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수직 메뉴 - 순수 JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
            color: #333;
        }
        
        .m_menu{
            width: 200px;
            margin: 20px auto;
            text-align: center;
        }

        .m_menu > li >a{
            display: block;
            height: 36px;
            background-color: #390;
            line-height: 36px;
            border-top: 1px dotted #fff;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .m_menu > li >a:hover{
            background-color: #2a7a00;
        }

        /* 서브메뉴 초기 숨김 - 트랜지션 효과를 위한 스타일 */
        .m_menu .sub {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
        }

        /* 서브메뉴 표시 - 트랜지션 효과 */
        .m_menu .sub.active {
            max-height: 500px; /* 충분히 큰 값으로 설정 */
            opacity: 1;
        }

        .m_menu .sub li{
            background-color: #cf9;
        }
        
        .m_menu .sub li a{
            display: block;
            height: 36px;
            line-height: 36px;
            color: #222;
            transition: background-color 0.2s ease;
        }

        .m_menu .sub li a:hover{
            background-color: #cf09;
        }
    </style>
    <script>
        // DOM이 로드된 후 실행
        document.addEventListener('DOMContentLoaded', function(){
            // 모든 메인 메뉴 링크 선택
            const mainMenuLinks = document.querySelectorAll('.m_menu > li > a');
            
            // 각 메인 메뉴에 클릭 이벤트 추가
            mainMenuLinks.forEach(function(link){
                link.addEventListener('click', function(e){
                    e.preventDefault(); // 기본 링크 동작 방지
                    
                    // 클릭한 메뉴의 부모 li 요소
                    const parentLi = this.parentElement;
                    // 해당 li 안의 서브메뉴 (.sub)
                    const subMenu = parentLi.querySelector('.sub');
                    
                    // 서브메뉴가 있는 경우에만 토글
                    if(subMenu){
                        // 다른 서브메뉴들 닫기
                        document.querySelectorAll('.m_menu .sub').forEach(function(sub){
                            if(sub !== subMenu){
                                sub.classList.remove('active');
                            }
                        });
                        
                        // 현재 서브메뉴 토글
                        subMenu.classList.toggle('active');
                    }
                });
            });
        });
    </script>
</head>
<body>
    <ul class="m_menu">
        <li>
            <a href="#">회사소개</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">제품소개</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">커뮤니티</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
        <li>
            <a href="#">다운로드</a>
            <ul class="sub">
                <li><a href="#">submenu1</a></li>
                <li><a href="#">submenu2</a></li>
                <li><a href="#">submenu3</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
