<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document - Vanilla JavaScript</title>
    <!-- jQuery 제거, 순수 JavaScript 사용 -->
</head>
<style>
    *{margin: 0; padding: 0;}
    a{text-decoration: none;}
    article{
        width: 100%;
        height: 100vh;
    }
    #article1{
        background-color: burlywood;
    }
    #article2{
        background-color: coral;
    }
    #article3{
        background-color: darkcyan;
    }
    #article4{
        background-color: darksalmon;
    }
    nav{
        position: fixed;
        top: 0;
        height: 100px;
        width: 100%;
        background: rgba(255, 255, 255, 0.5);
    }
    nav ul{
        width: 1000px;
        height: 100px;
        margin: 0 auto;
        list-style: none;
    }

    nav.on{
        position: fixed;
        background: rgba(0, 0, 0, 0.5);
    }

    nav.on ul li a{
        color: #fff;
    }

    nav.on ul li.on a{
        color: orange;
        font-weight: bold;
    }

    nav ul li{
        float: left;
    }

    nav ul li a{
        display: block;
        width: 250px;
        height: 100px;
        line-height: 100px;
        font-size: 32px;
        color: #000;
        text-align: center;
    }

    nav ul li.on a{
        color: orange;
        font-weight: bold;
    }

    h2{
        position: fixed;
        bottom: 0;
        right: 0;
        z-index: 100;
    }

    #floatdiv{
        width: 70px;
        height: 200px;
        background-color: dimgray;
        padding-top: 10px;
        position: absolute;
        /* position: fixed; */
        right: 50px;
        top: 250px;
    }

    #floatdiv ul li{
        list-style: none;
        width: 25px;
        height: 25px;
        border-radius: 13px;
        background-color: #fff;
        margin-left: 20px;
        margin-top: 20px;
        cursor: pointer;
    }
    #floatdiv ul li.on{
        background-color: orange;
    }

    #popup{
        width: 301px;
        height: 351px;
        position: absolute;
        top: 210px;
        left: 50px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        display: none;
    }

    #notice_wrap{
        width: 301px;
        position: absolute;
        top: 210px;
        left: 400px;
        box-shadow: 0   0   8px #000;
        font-size: 12px;
    }

    #notice_wrap img{float: left;}

    .closeWrap{
        background-color: #000;
        color: #fff;
        text-align: right;
        padding: 5px 10px;
    }

    .closeWrap button{
        margin-left: 20px; cursor: pointer;
    }
</style>
<body>
    <nav>
        <ul>
            <li class="on"><a href="#article1">회사소개</a></li>
            <li><a href="#article2">제품소개</a></li>
            <li><a href="#article3">커뮤니티</a></li>
            <li><a href="#article4">다운로드</a></li>
        </ul>
    </nav>
    <section>
        <article id="article1"></article>
        <article id="article2"></article>
        <article id="article3"></article>
        <article id="article4"></article>
    </section>
    <h2>현재 스크롤 위치 : <span id="sTop">000</span></h2>
    <div id="floatdiv">
        <ul>
            <li class="on"><span id="btn1"></span></li>
            <li><span id="btn2"></span></li>
            <li><span id="btn3"></span></li>
            <li><span id="btn4"></span></li>
        </ul>
    </div>
    <div id="popup">
        <img src="images/popup.jpg" usemap="#pop" alt="">
        <map name="pop" id="pop">
            <area shape="rect" coords="252,330, 295,348" href="#" alt="창닫기">
            <area shape="rect" coords="95,330, 215,348" href="#" alt="하루">
        </map>
    </div>
    <div id="notice_wrap">
        <img src="images/popup1.jpg" alt="공지">
        <p class="closeWrap">
            <input type="checkbox" name="expiresChk" id="expiresChk">
            <label for="expiresChk">3일 동안 이 창 열지않기</label>
            <button class="closeBtn">닫기</button>
        </p>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
