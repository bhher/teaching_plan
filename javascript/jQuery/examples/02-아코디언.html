<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>실습2 — 아코디언</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    .item { border: 1px solid #ddd; margin-bottom: 8px; }
    .title {
      padding: 12px 16px; background: #f0f4f8; cursor: pointer; font-weight: bold;
    }
    .title:hover { background: #e2e8f0; }
    .content { display: none; padding: 12px 16px; }
  </style>
</head>
<body>
  <h1>아코디언 FAQ</h1>
  <div class="item">
    <div class="title">Q. Java란?</div>
    <div class="content">A. 객체지향 프로그래밍 언어입니다.</div>
  </div>
  <div class="item">
    <div class="title">Q. Spring이란?</div>
    <div class="content">A. Java 기반 웹 애플리케이션 프레임워크입니다.</div>
  </div>
  <div class="item">
    <div class="title">Q. jQuery란?</div>
    <div class="content">A. JavaScript를 쉽게 다루는 라이브러리입니다.</div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $(".title").on("click", function () {
        $(".content").not($(this).next()).slideUp(300);
        $(this).next().slideToggle(300);
      });
    });
  </script>
</body>
</html>
