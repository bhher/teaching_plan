<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>실습5 — 회원가입 유효성</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    .err { color: #dc2626; font-size: 12px; min-height: 16px; }
    button {
      margin-top: 16px; width: 100%; padding: 10px;
      background: #2563eb; color: #fff; border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>회원가입</h1>
  <form id="joinForm">
    <label>아이디 <input type="text" id="userId" /></label>
    <div class="err" id="errId"></div>
    <label>비밀번호 <input type="password" id="pw" /></label>
    <div class="err" id="errPw"></div>
    <label>비밀번호 확인 <input type="password" id="pw2" /></label>
    <div class="err" id="errPw2"></div>
    <label>이름 <input type="text" id="userName" /></label>
    <div class="err" id="errName"></div>
    <label>이메일 <input type="text" id="email" /></label>
    <div class="err" id="errEmail"></div>
    <label>전화번호 <input type="text" id="phone" /></label>
    <div class="err" id="errPhone"></div>
    <button type="submit">가입하기</button>
  </form>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $("#joinForm").on("submit", function (e) {
        e.preventDefault();
        $(".err").text("");

        var ok = true;
        function need(sel, errId, msg) {
          if (!$(sel).val().trim()) {
            $(errId).text(msg);
            ok = false;
          }
        }
        need("#userId", "#errId", "아이디를 입력하세요");
        need("#pw", "#errPw", "비밀번호를 입력하세요");
        need("#pw2", "#errPw2", "비밀번호 확인을 입력하세요");
        need("#userName", "#errName", "이름을 입력하세요");
        need("#email", "#errEmail", "이메일을 입력하세요");
        need("#phone", "#errPhone", "전화번호를 입력하세요");

        if ($("#pw").val() && $("#pw").val() !== $("#pw2").val()) {
          $("#errPw2").text("비밀번호가 일치하지 않습니다");
          ok = false;
        }
        if ($("#email").val() && $("#email").val().indexOf("@") < 0) {
          $("#errEmail").text("이메일 형식이 올바르지 않습니다");
          ok = false;
        }
        if (ok) alert("가입 완료");
      });
    });
  </script>
</body>
</html>
