<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS 스와이프 슬라이더</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .slider-container {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: #fff;
            margin-bottom: 30px;
        }
        
        .slider {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
            will-change: transform;
        }
        
        .slide {
            min-width: 100%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
        }
        
        .slide-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .slide-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .slide-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .slide-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        
        .indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: #007bff;
            width: 30px;
            border-radius: 6px;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vanilla JS 스와이프 슬라이더</h1>
        
        <div class="slider-container" id="sliderContainer">
            <div class="slider" id="slider">
                <div class="slide slide-1">Slide 1</div>
                <div class="slide slide-2">Slide 2</div>
                <div class="slide slide-3">Slide 3</div>
                <div class="slide slide-4">Slide 4</div>
                <div class="slide slide-5">Slide 5</div>
            </div>
        </div>
        
        <div class="indicators" id="indicators">
            <span class="indicator active" data-index="0"></span>
            <span class="indicator" data-index="1"></span>
            <span class="indicator" data-index="2"></span>
            <span class="indicator" data-index="3"></span>
            <span class="indicator" data-index="4"></span>
        </div>
        
        <div class="info">
            모바일: 손가락으로 좌우 스와이프 | 데스크톱: 마우스로 드래그
        </div>
    </div>
    
    <script>
        const slider = document.getElementById('slider');
        const sliderContainer = document.getElementById('sliderContainer');
        const indicators = document.querySelectorAll('.indicator');
        const slides = slider.querySelectorAll('.slide');
        
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;
        let currentIndex = 0;
        const totalSlides = slides.length;
        const threshold = 50; // 스와이프 임계값 (px)
        
        // 슬라이드 표시 함수
        function showSlide(index) {
            if (index < 0) {
                currentIndex = 0;
            } else if (index >= totalSlides) {
                currentIndex = totalSlides - 1;
            } else {
                currentIndex = index;
            }
            
            slider.style.transition = 'transform 0.3s ease';
            slider.style.transform = `translateX(${-currentIndex * 100}%)`;
            
            // 인디케이터 업데이트
            indicators.forEach(function(indicator, idx) {
                indicator.classList.toggle('active', idx === currentIndex);
            });
        }
        
        // 터치 시작
        sliderContainer.addEventListener('touchstart', function(e) {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            slider.style.transition = 'none';
        });
        
        // 마우스 시작
        sliderContainer.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            slider.style.transition = 'none';
            sliderContainer.style.cursor = 'grabbing';
        });
        
        // 터치 이동
        sliderContainer.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            
            currentX = e.touches[0].clientX;
            currentY = e.touches[0].clientY;
            
            const diffX = Math.abs(currentX - startX);
            const diffY = Math.abs(currentY - startY);
            
            // X축 이동이 Y축 이동보다 클 때만 스와이프 (세로 스크롤 방지)
            if (diffX > diffY) {
                e.preventDefault();
                const diff = currentX - startX;
                const baseTranslate = -currentIndex * 100;
                slider.style.transform = `translateX(calc(${baseTranslate}% + ${diff}px))`;
            }
        });
        
        // 마우스 이동
        sliderContainer.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            e.preventDefault();
            currentX = e.clientX;
            currentY = e.clientY;
            
            const diffX = Math.abs(currentX - startX);
            const diffY = Math.abs(currentY - startY);
            
            // X축 이동이 Y축 이동보다 클 때만 드래그
            if (diffX > diffY) {
                const diff = currentX - startX;
                const baseTranslate = -currentIndex * 100;
                slider.style.transform = `translateX(calc(${baseTranslate}% + ${diff}px))`;
            }
        });
        
        // 터치 종료
        sliderContainer.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            
            isDragging = false;
            const diff = currentX - startX;
            
            // 스와이프 판단
            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // 오른쪽으로 스와이프 (이전 슬라이드)
                    showSlide(currentIndex - 1);
                } else {
                    // 왼쪽으로 스와이프 (다음 슬라이드)
                    showSlide(currentIndex + 1);
                }
            } else {
                // 임계값 미만이면 원래 위치로 복귀
                showSlide(currentIndex);
            }
        });
        
        // 마우스 종료
        sliderContainer.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            
            isDragging = false;
            sliderContainer.style.cursor = 'grab';
            const diff = currentX - startX;
            
            // 드래그 판단
            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    showSlide(currentIndex - 1);
                } else {
                    showSlide(currentIndex + 1);
                }
            } else {
                showSlide(currentIndex);
            }
        });
        
        // 마우스가 컨테이너 밖으로 나갔을 때
        sliderContainer.addEventListener('mouseleave', function(e) {
            if (isDragging) {
                isDragging = false;
                sliderContainer.style.cursor = 'grab';
                showSlide(currentIndex);
            }
        });
        
        // 인디케이터 클릭
        indicators.forEach(function(indicator, index) {
            indicator.addEventListener('click', function() {
                showSlide(index);
            });
        });
        
        // 키보드 네비게이션
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                showSlide(currentIndex - 1);
            } else if (e.key === 'ArrowRight') {
                showSlide(currentIndex + 1);
            }
        });
        
        // 초기 커서 설정
        sliderContainer.style.cursor = 'grab';
        
        // 초기 슬라이드 표시
        showSlide(0);
    </script>
</body>
</html>
