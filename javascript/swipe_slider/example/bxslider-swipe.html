<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bxSlider 스와이프 예제</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .slider li {
            list-style: none;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        
        .slide-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .slide-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .slide-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>bxSlider 스와이프 예제</h1>
        
        <ul class="slider">
            <li class="slide-1">Slide 1</li>
            <li class="slide-2">Slide 2</li>
            <li class="slide-3">Slide 3</li>
            <li class="slide-4">Slide 4</li>
        </ul>
        
        <div class="info">
            bxSlider는 기본적으로 터치 스와이프를 지원합니다.
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>
    
    <script>
        $(document).ready(function(){
            $('.slider').bxSlider({
                // 스와이프 설정
                touchEnabled: true,        // 터치 활성화
                swipeThreshold: 50,        // 스와이프 임계값 (px)
                oneToOneTouch: true,       // 1:1 터치 비율
                preventDefaultSwipeX: true, // X축 스와이프 기본 동작 방지
                
                // 기본 설정
                pager: true,
                controls: true,
                auto: false
            });
        });
    </script>
</body>
</html>
