<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slick Slider 스와이프 예제</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .slider .slide {
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        
        .slide-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .slide-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .slide-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Slick Slider 스와이프 예제</h1>
        
        <div class="slider">
            <div class="slide slide-1">Slide 1</div>
            <div class="slide slide-2">Slide 2</div>
            <div class="slide slide-3">Slide 3</div>
            <div class="slide slide-4">Slide 4</div>
        </div>
        
        <div class="info">
            Slick Slider는 기본적으로 터치 스와이프를 지원합니다.
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    
    <script>
        $(document).ready(function(){
            $('.slider').slick({
                // 스와이프 설정
                swipe: true,           // 스와이프 활성화
                touchMove: true,       // 터치 이동 활성화
                swipeToSlide: true,    // 스와이프로 슬라이드 이동
                draggable: true,       // 드래그 가능
                touchThreshold: 5,      // 터치 임계값
                
                // 기본 설정
                dots: true,
                arrows: true,
                infinite: true
            });
        });
    </script>
</body>
</html>
