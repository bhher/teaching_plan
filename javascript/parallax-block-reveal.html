<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Scrolling Effects</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abel">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:100,300,400,700,900">
    <style>
        * { margin: 0; padding: 0; }
        *, *::after, *::before { box-sizing: border-box; }
        li { list-style: none; }
        a { text-decoration: none; }

        #nav {
            position: fixed; left: 0; top: 0; width: 100%; height: 61px;
            z-index: 1000; background-color: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            transition: transform 0.3s ease;
        }
        #nav.hide { transform: translateY(-61px); }
        #nav h1 {
            float: left; color: #000; font-size: 40px;
            padding: 5px 5px 5px 15px; font-family: 'Abel', sans-serif;
        }

        .section.s1 { background-color: #d0cfc5; }
        .section.s2 { background-color: #ccc; }
        .section.s3 { background-color: #ddd; }
        .section.s4 { background-color: #eee; }
        .section.s5 { background-color: #ddd; }
        .section.s6 { background-color: #ccc; }

        .section.s1 {
            position: relative; overflow: hidden; text-align: center;
        }
        .section.s1 .sec1_text {
            padding: 15vw 5vw 10vw;
            font-size: 8vw; line-height: 1.2; margin: auto;
            color: #141417; font-family: 'Poppins', sans-serif;
        }

        .section {
            overflow: hidden; display: flex; flex-direction: row;
            flex-wrap: wrap; align-items: center;
            color: #141417; height: 100vh; min-height: 600px;
            font-family: 'Poppins', sans-serif;
        }
        .section .sec_text {
            width: 50vw; font-size: clamp(28px, 6vw, 90px);
            line-height: 1.2; text-align: right; padding: 0 0 0 2em;
            flex: none; position: relative; z-index: 2;
            display: inline-block; white-space: nowrap;
        }
        .section .sec_text.title_left { margin-left: -18vw; }
        .section .sec_text .st1 { margin-top: 160px; }
        .section .sec_img {
            width: 50vw; will-change: transform;
        }
        .section img {
            width: 100%; display: block; vertical-align: top;
        }

        footer {
            height: 200px; background: #222; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Abel', sans-serif; font-size: 20px;
        }
    </style>
</head>
<body>
    <nav id="nav">
        <h1>WEB'S</h1>
    </nav>

    <main>
        <section class="section s1">
            <h2 class="sec1_text">
                <div class="txt1">Parallax Scrolling</div>
                <div class="txt2">Effects</div>
            </h2>
        </section>

        <section class="section s2">
            <h2 class="sec_text">
                <div class="st1 scrolled1">funky foxes love</div>
                <div class="st2 scrolled2">technology</div>
            </h2>
            <figure class="sec_img">
                <div class="si1 scrolled3">
                    <img src="https://picsum.photos/id/1015/1200/900" alt="풍경 1">
                </div>
            </figure>
        </section>

        <section class="section s3">
            <figure class="sec_img">
                <div class="si1 scrolled3">
                    <img src="https://picsum.photos/id/1016/1200/900" alt="풍경 2">
                </div>
            </figure>
            <h2 class="sec_text title_left">
                <div class="st1 scrolled1">funky foxes love</div>
                <div class="st2 scrolled2">technology</div>
            </h2>
        </section>

        <section class="section s4">
            <h2 class="sec_text">
                <div class="st1 scrolled1">funky foxes love</div>
                <div class="st2 scrolled2">technology</div>
            </h2>
            <figure class="sec_img">
                <div class="si1 scrolled3">
                    <img src="https://picsum.photos/id/1018/1200/900" alt="풍경 3">
                </div>
            </figure>
        </section>

        <section class="section s5">
            <figure class="sec_img">
                <div class="si1 scrolled3">
                    <img src="https://picsum.photos/id/1025/1200/900" alt="풍경 4">
                </div>
            </figure>
            <h2 class="sec_text title_left">
                <div class="st1 scrolled1">funky foxes love</div>
                <div class="st2 scrolled2">technology</div>
            </h2>
        </section>

        <section class="section s6">
            <h2 class="sec_text">
                <div class="st1 scrolled1">funky foxes love</div>
                <div class="st2 scrolled2">technology</div>
            </h2>
            <figure class="sec_img">
                <div class="si1 scrolled3">
                    <img src="https://picsum.photos/id/1036/1200/900" alt="풍경 5">
                </div>
            </figure>
        </section>

        <footer>Parallax Demo · Scroll up &amp; down</footer>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>
        (function () {
            var $nav = $('#nav');
            var lastScroll = 0;

            function parallaxAxis($target, offset, axis) {
                if (axis === 'x') {
                    $target.css('transform', 'translate(' + offset + 'px, 0)');
                } else {
                    $target.css('transform', 'translate(0, ' + offset + 'px)');
                }
            }

            // 섹션이 화면에 들어오기 직전부터 패럴랙스 적용
            function applySection($sec, imgAxis, imgSpeed, textSpeed) {
                var sct = $(window).scrollTop();
                var wh = $(window).height();
                var top = $sec.offset().top;
                if (sct < top - wh) return;

                var offset = sct - top;
                parallaxAxis($sec.find('.sec_img'), offset * imgSpeed, imgAxis);
                // 텍스트는 이미지보다 약하게 (입체감)
                parallaxAxis($sec.find('.scrolled1'), offset * textSpeed, imgAxis === 'x' ? 'x' : 'y');
                parallaxAxis($sec.find('.scrolled2'), offset * textSpeed * 0.6, imgAxis === 'x' ? 'x' : 'y');
            }

            $(window).on('scroll', function () {
                var sct = $(window).scrollTop();

                // 헤더: 아래로 스크롤하면 숨김, 위로 올리면 표시
                if (sct > lastScroll && sct > 80) {
                    $nav.addClass('hide');
                } else {
                    $nav.removeClass('hide');
                }
                lastScroll = sct;

                // s2,s3,s6 = 가로 / s4 = 세로 / s5 = 세로 2배
                applySection($('.s2'), 'x', 1, 0.25);
                applySection($('.s3'), 'x', 1, 0.25);
                applySection($('.s4'), 'y', 1, 0.2);   // 중복 transform 제거 후 세로만
                applySection($('.s5'), 'y', 2, 0.3);
                applySection($('.s6'), 'x', 1, 0.25);
            });
        })();
    </script>
</body>
</html>
