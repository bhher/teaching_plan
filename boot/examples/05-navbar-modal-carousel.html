<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05. Navbar · Modal · Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MySite</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <p class="mb-3"><a href="../index.html" class="text-decoration-none">← 목록</a></p>
    <h1 class="mb-4">Navbar · Modal · Carousel</h1>

    <!-- Modal trigger -->
    <section class="mb-5">
      <h2 class="h5 mb-3">Modal</h2>
      <button class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#myModal">
        회원가입 열기
      </button>
    </section>

    <!-- Carousel -->
    <section>
      <h2 class="h5 mb-3">Carousel</h2>
      <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner rounded">
          <div class="carousel-item active">
            <div class="d-flex align-items-center justify-content-center bg-primary text-white"
                 style="height: 220px;">
              <h3 class="mb-0">Slide 1</h3>
            </div>
          </div>
          <div class="carousel-item">
            <div class="d-flex align-items-center justify-content-center bg-success text-white"
                 style="height: 220px;">
              <h3 class="mb-0">Slide 2</h3>
            </div>
          </div>
          <div class="carousel-item">
            <div class="d-flex align-items-center justify-content-center bg-info text-white"
                 style="height: 220px;">
              <h3 class="mb-0">Slide 3</h3>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
      <p class="small text-muted mt-2">이미지 대신 색상 박스로 슬라이드를 보여 줍니다. (Slick / bxSlider와 비슷한 역할)</p>
    </section>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="myModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">회원가입</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
          <button type="button" class="btn btn-primary">가입하기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
