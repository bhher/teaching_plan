<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04. Bootstrap 컴포넌트</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <p class="mb-3"><a href="../index.html" class="text-decoration-none">← 목록</a></p>
    <h1 class="mb-4">Component — Button · Card · Form · Alert · Table</h1>

    <!-- Button -->
    <section class="mb-5">
      <h2 class="h5 mb-3">Button</h2>
      <button class="btn btn-primary me-1 mb-2">Primary</button>
      <button class="btn btn-success me-1 mb-2">Success</button>
      <button class="btn btn-danger me-1 mb-2">Danger</button>
      <button class="btn btn-outline-primary me-1 mb-2">Outline</button>
      <button class="btn btn-primary btn-sm me-1 mb-2">Small</button>
      <button class="btn btn-primary btn-lg mb-2">Large</button>
    </section>

    <!-- Alert -->
    <section class="mb-5">
      <h2 class="h5 mb-3">Alert</h2>
      <div class="alert alert-success">저장되었습니다.</div>
      <div class="alert alert-danger mb-0">오류가 발생했습니다.</div>
    </section>

    <!-- Form -->
    <section class="mb-5">
      <h2 class="h5 mb-3">Form</h2>
      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">이름</label>
            <input type="text" class="form-control" placeholder="이름을 입력하세요">
          </div>
          <div class="mb-3">
            <label class="form-label">지역</label>
            <select class="form-select">
              <option>서울</option>
              <option>부산</option>
              <option>대구</option>
            </select>
          </div>
          <button class="btn btn-primary">등록</button>
        </div>
      </div>
    </section>

    <!-- Card -->
    <section class="mb-5">
      <h2 class="h5 mb-3">Card</h2>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">노트북</h5>
              <p class="card-text text-muted">최신 노트북입니다.</p>
              <button class="btn btn-primary btn-sm">구매</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">마우스</h5>
              <p class="card-text text-muted">무선 마우스입니다.</p>
              <button class="btn btn-primary btn-sm">구매</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">키보드</h5>
              <p class="card-text text-muted">기계식 키보드입니다.</p>
              <button class="btn btn-primary btn-sm">구매</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section>
      <h2 class="h5 mb-3">Table</h2>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>번호</th>
            <th>이름</th>
            <th>나이</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>홍길동</td><td>25</td></tr>
          <tr><td>2</td><td>김철수</td><td>30</td></tr>
          <tr><td>3</td><td>이영희</td><td>28</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
