<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="한가위 보름달처럼, 풍성하고 따뜻한 추석 되세요.">
  <meta property="og:title" content="추석 인사 — 한가위 보름달">
  <meta property="og:description" content="한가위 보름달처럼, 풍성하고 따뜻한 추석 되세요.">
  <meta property="og:type" content="website">
  <title>추석 인사</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="card-stage">
    <!-- 하늘 · 달 · 산 (풀블리드 한 장) -->
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="moon">
        <span class="moon-glow"></span>
      </div>
      <div class="hill hill-back"></div>
      <div class="hill hill-front"></div>
      <div class="lantern lantern-l"></div>
      <div class="lantern lantern-r"></div>
    </div>

    <div class="container greeting">
      <p class="brand fade-up">한가위</p>
      <h1 class="title fade-up delay-1">추석<br>잘 보내세요</h1>
      <p class="lead fade-up delay-2">
        보름달처럼 밝고<br>
        풍성한 명절 되시길 바랍니다.
      </p>
      <p class="from fade-up delay-3">— 드림</p>
    </div>
  </main>

</body>
</html>
