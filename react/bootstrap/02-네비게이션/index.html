<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 네비게이션</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body {
            padding-top: 56px; /* 네비게이션 높이만큼 여백 */
        }
        .navbar-brand {
            font-weight: bold;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        .dropdown-menu {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .content-section {
            padding: 60px 0;
            min-height: 500px;
        }
    </style>
</head>
<body>
    <!-- 기본 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-house-door me-2"></i>
                My Website
            </a>
            
            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">
                            <i class="bi bi-house me-1"></i>홈
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">
                            <i class="bi bi-info-circle me-1"></i>소개
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#services">
                            <i class="bi bi-briefcase me-1"></i>서비스
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a 
                            class="nav-link dropdown-toggle" 
                            href="#" 
                            id="navbarDropdown" 
                            role="button" 
                            data-bs-toggle="dropdown"
                        >
                            <i class="bi bi-grid me-1"></i>더보기
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-person me-2"></i>프로필
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-gear me-2"></i>설정
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-box-arrow-right me-2"></i>로그아웃
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                
                <!-- 검색 폼 -->
                <form class="d-flex me-3">
                    <input 
                        class="form-control me-2" 
                        type="search" 
                        placeholder="검색..." 
                        aria-label="Search"
                    >
                    <button class="btn btn-outline-light" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                
                <!-- 버튼 -->
                <div class="d-flex">
                    <button class="btn btn-primary me-2">
                        <i class="bi bi-person-plus me-1"></i>회원가입
                    </button>
                    <button class="btn btn-outline-light">
                        <i class="bi bi-box-arrow-in-right me-1"></i>로그인
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 컨텐츠 영역 -->
    <div class="container mt-5">
        <div id="home" class="content-section">
            <h1 class="display-4 mb-4">
                <i class="bi bi-house-door text-primary"></i>
                홈 페이지
            </h1>
            <p class="lead">
                Bootstrap 네비게이션 바 예제입니다. 다양한 스타일과 기능을 확인해보세요!
            </p>
        </div>
        
        <div id="about" class="content-section">
            <h2 class="mb-4">
                <i class="bi bi-info-circle text-info"></i>
                소개
            </h2>
            <p>
                이 페이지는 Bootstrap의 네비게이션 컴포넌트를 보여줍니다.
            </p>
        </div>
        
        <div id="services" class="content-section">
            <h2 class="mb-4">
                <i class="bi bi-briefcase text-success"></i>
                서비스
            </h2>
            <p>
                다양한 서비스를 제공합니다.
            </p>
        </div>
    </div>
    
    <!-- 스크롤 스무스 처리 -->
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
