<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 - 내 위치 찾기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px; margin: 0 auto; background: #fff;
            border-radius: 20px; padding: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 8px;
            background: #667eea; color: #fff; cursor: pointer; font-size: 14px;
        }
        .btn:hover { background: #764ba2; }
        #map {
            width: 100%; height: 480px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .info {
            margin-top: 16px; background: #f5f5f5; border-radius: 10px; padding: 16px; line-height: 1.7;
        }
        .tip { margin-top: 12px; padding: 12px; background: #fff8e6; border-left: 4px solid #ffc107; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 내 위치 찾기</h1>
        <p class="subtitle">브라우저 GPS(Geolocation)로 현재 위치를 받아 지도에 표시합니다.</p>
        <div class="toolbar">
            <button class="btn" onclick="findMe()">내 위치 표시</button>
        </div>
        <div id="map"></div>
        <div class="info">
            <div id="msg">버튼을 누르면 위치 권한을 요청합니다.</div>
            <div class="tip">
                HTTPS 또는 localhost에서만 GPS가 잘 동작합니다.
                수업 포인트: <code>navigator.geolocation.getCurrentPosition</code> + <code>kakao.maps.LatLng</code>
            </div>
        </div>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bceccd594bb478b5533d7d2ec63f8bb0"></script>
    <script>
        var map = new kakao.maps.Map(document.getElementById('map'), {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 5
        });
        var marker = null;
        var infowindow = new kakao.maps.InfoWindow({
            content: '<div style="padding:8px;font-size:13px;">여기가 내 위치!</div>'
        });

        function findMe() {
            if (!navigator.geolocation) {
                document.getElementById('msg').textContent = '이 브라우저는 위치 정보를 지원하지 않습니다.';
                return;
            }

            document.getElementById('msg').textContent = '위치 확인 중...';

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var lat = pos.coords.latitude;
                    var lng = pos.coords.longitude;
                    var coords = new kakao.maps.LatLng(lat, lng);

                    if (marker) marker.setMap(null);
                    marker = new kakao.maps.Marker({ map: map, position: coords });
                    map.setCenter(coords);
                    map.setLevel(3);
                    infowindow.open(map, marker);

                    document.getElementById('msg').textContent =
                        '위도 ' + lat.toFixed(6) + ' / 경도 ' + lng.toFixed(6);
                },
                function (err) {
                    document.getElementById('msg').textContent =
                        '위치를 가져오지 못했습니다. (권한 거부 또는 오류: ' + err.message + ')';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
</body>
</html>
